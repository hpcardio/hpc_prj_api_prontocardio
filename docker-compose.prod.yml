services:
  api_prontocardio:
    image: api_prontocardio
    build:
      context: .
    env_file:
      - .env
    environment:
      WHATSAPP_AGENDA_USUARIOS: prontogestao@hospitalprontocardio.com.br
      APP_ENV: production
      FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_PASSWORD_RESET_URL:?configure a URL publica de redefinicao de senha}
      EXPECTED_POSTGRES_HOST: ${EXPECTED_POSTGRES_HOST:?configure o host oficial}
      EXPECTED_POSTGRES_DATABASE: ${EXPECTED_POSTGRES_DATABASE:?configure o banco oficial}
      # Login MV (CAS + proxy Oracle) do Receita Certa. Sem elas a API sobe, mas
      # o "Entrar com login MV" falha ("URL de retorno do CAS não autorizada") e
      # nada é gravado no MV com o login do usuário (25/11/2026). Falhar no deploy.
      MV_CAS_SERVICE_URL: ${MV_CAS_SERVICE_URL:?configure a URL de retorno do login MV (CAS), igual a do frontend}
      MV_PROXY_USER: ${MV_PROXY_USER:-RC_PROXY}
      MV_PROXY_PASSWORD: ${MV_PROXY_PASSWORD:?configure a senha do usuario proxy Oracle do login MV}
    expose:
      - "8000"
    extra_hosts:
      - "host-gateway:host-gateway"
    volumes:
      - ./data/evolucao-sadt:/app/evolucao_sadt_data
    networks:
      default:
      api_rede_proxy:
        aliases:
          - api_prontocardio
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    profiles:
      - standalone
    image: nginx:stable-alpine3.19-slim
    container_name: api_prontocardio_nginx
    depends_on:
      api_prontocardio:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_HOST_PORT: api_prontocardio:8000
      SERVER_NAME: ${SERVER_NAME:-apihpc.hospitalprontocardio.com.br}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-/etc/letsencrypt/live/apihpc.hospitalprontocardio.com.br/fullchain.pem}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:-/etc/letsencrypt/live/apihpc.hospitalprontocardio.com.br/privkey.pem}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50M}
    volumes:
      - ./server/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./server/letsencrypt:/etc/letsencrypt:ro
      - ./server/certbot:/var/www/certbot:ro
    restart: unless-stopped

networks:
  api_rede_proxy:
    external: true
    name: api-rede_default
